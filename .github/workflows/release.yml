name: Release

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Immutable release candidate artifact ID
        required: true
        type: string
      candidate_run_id:
        description: Release candidate workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: release

jobs:
  publish:
    name: Publish the verified candidate
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.id }}
      has-candidate: ${{ steps.artifact.outputs.has-candidate }}
    steps:
      - name: Check out the reviewed scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: reviewed-source
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts
            .github/release-contract.json
          sparse-checkout-cone-mode: false
      - name: Verify the candidate workflow run
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: bash reviewed-source/.github/scripts/release/verify-run.sh
      - name: Resolve the exact candidate artifact
        id: artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          artifacts="$(gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID/artifacts")"
          candidates="$(jq --argjson id "$ARTIFACT_ID" '[.artifacts[] | select(.id == $id and (.name | startswith("release-candidate-")) and (.expired == false))]' <<<"$artifacts")"
          count="$(jq 'length' <<<"$candidates")"
          test "$count" = 1
          echo 'has-candidate=true' >> "$GITHUB_OUTPUT"
          echo "id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          github-token: ${{ github.token }}
          path: dist/release-candidate
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify the candidate manifest, tag and digest
        id: manifest
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: bash reviewed-source/.github/scripts/release/verify-candidate.sh publish
      - name: Verify protected candidate attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_PATH: ${{ steps.manifest.outputs.vsix-path }}
          SOURCE_SHA: ${{ steps.manifest.outputs.source-sha }}
        run: bash reviewed-source/.github/scripts/release/verify-attestation.sh
      - name: Publish to the Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        with:
          extensionFile: ${{ steps.manifest.outputs.vsix-path }}
          pat: ${{ env.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        with:
          extensionFile: ${{ steps.manifest.outputs.vsix-path }}
          pat: ${{ env.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
      - name: Compare post-publish registry copies
        # Registry bytes are checked after both publish actions.
        shell: bash
        env:
          CANDIDATE_VSIX: ${{ steps.manifest.outputs.vsix-path }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          package_json="$(unzip -p "$CANDIDATE_VSIX" extension/package.json)"
          publisher="$(jq -er '.publisher' <<<"$package_json")"
          name="$(jq -er '.name' <<<"$package_json")"
          [[ "$publisher" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist/published
          marketplace_url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$publisher/vsextensions/$name/$VERSION/vspackage"
          openvsx_url="https://open-vsx.org/api/$publisher/$name/$VERSION/file/$publisher.$name-$VERSION.vsix"
          curl_args=(
            --fail --silent --show-error --location --compressed
            --proto '=https' --proto-redir '=https' --max-redirs 3
            --connect-timeout 10 --max-time 120 --max-filesize 1126757
            --retry 45 --retry-delay 20 --retry-all-errors --retry-max-time 900
          )
          curl "${curl_args[@]}" "$marketplace_url" --output dist/published/marketplace.vsix
          curl "${curl_args[@]}" "$openvsx_url" --output dist/published/openvsx.vsix
          test "$(wc -c < dist/published/marketplace.vsix)" -le 1126757
          test "$(wc -c < dist/published/openvsx.vsix)" -le 1126757
          python3 - "$CANDIDATE_VSIX" dist/published/marketplace.vsix dist/published/openvsx.vsix <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          EXTENSION_PREFIX = "extension/"
          MAX_PACKAGED_FILES = 26
          MAX_COMPRESSED_BYTES = 1126757
          MAX_ENTRY_BYTES = 5242880
          MAX_UNCOMPRESSED_BYTES = 10485760

          def fail(message):
              raise SystemExit(message)

          def inspect(path):
              try:
                  with zipfile.ZipFile(path) as archive:
                      entries = []
                      seen = set()
                      infos = archive.infolist()
                      packaged_files = [info for info in infos if info.filename.startswith(EXTENSION_PREFIX)]
                      if len(packaged_files) > MAX_PACKAGED_FILES:
                          fail(f"published VSIX has too many packaged files: {len(packaged_files)}")
                      uncompressed_total = sum(info.file_size for info in infos)
                      if os.path.getsize(path) > MAX_COMPRESSED_BYTES:
                          fail(f"published VSIX compressed payload exceeds {MAX_COMPRESSED_BYTES} bytes")
                      if uncompressed_total > MAX_UNCOMPRESSED_BYTES:
                          fail(f"published VSIX expanded payload exceeds {MAX_UNCOMPRESSED_BYTES} bytes")
                      for info in infos:
                          if info.file_size > MAX_ENTRY_BYTES:
                              fail(f"published VSIX entry is too large: {info.filename}")
                          name = info.filename
                          if (not name or name.startswith("/") or "\\" in name
                                  or any(part in ("", "..") for part in name.split("/"))
                                  or name.endswith("/")):
                              fail(f"unsafe published archive path: {name}")
                          if name in seen:
                              fail(f"duplicate published archive path: {name}")
                          seen.add(name)
                          mode = (info.external_attr >> 16) & 0xffff
                          if stat.S_IFMT(mode) == stat.S_IFLNK:
                              fail(f"published archive contains a symlink: {name}")
                          entries.append((name, archive.read(info)))
              except (OSError, zipfile.BadZipFile, RuntimeError, ValueError) as error:
                  fail(f"unsafe published VSIX: {error}")
              by_name = dict(entries)
              try:
                  package = json.loads(by_name["extension/package.json"])
              except (KeyError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"published package manifest is invalid: {error}")
              identity = tuple(package.get(key) for key in ("name", "version", "publisher"))
              if any(not isinstance(value, str) or not value for value in identity):
                  fail("published package manifest identity is incomplete")
              outer = by_name.get("extension.vsixmanifest")
              if outer is None or b"<!DOCTYPE" in outer.upper() or b"<!ENTITY" in outer.upper():
                  fail("published outer manifest is missing or contains forbidden declarations")
              try:
                  root = ET.fromstring(outer)
                  metadata = next(child for child in root if child.tag.rsplit("}", 1)[-1] == "Metadata")
                  identity_node = next(child for child in metadata if child.tag.rsplit("}", 1)[-1] == "Identity")
              except (ET.ParseError, StopIteration) as error:
                  fail(f"published outer manifest identity is invalid: {error}")
              outer_identity = (identity_node.attrib.get("Id"), identity_node.attrib.get("Version"), identity_node.attrib.get("Publisher"))
              if outer_identity != identity:
                  fail("published VSIX package and outer identities differ")
              normalized = "".join(
                  f"{hashlib.sha256(content).hexdigest()}  {name}\n"
                  for name, content in sorted(entries)
              )
              with open(path, "rb") as handle:
                  raw = handle.read()
              return raw, identity, normalized

          candidate, candidate_identity, candidate_manifest = inspect(sys.argv[1])
          for registry_path in sys.argv[2:]:
              published, published_identity, published_manifest = inspect(registry_path)
              if published == candidate:
                  print(f"{registry_path}: exact candidate bytes")
              elif published_identity == candidate_identity and published_manifest == candidate_manifest:
                  print(f"{registry_path}: accepted explicit registry re-pack")
              else:
                  fail(f"{registry_path}: registry copy does not match candidate identity and normalized manifest")
          PY
  finalize:
    name: Finalize the GitHub release
    needs: publish
    if: ${{ needs.publish.outputs.has-candidate == 'true' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the reviewed scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: reviewed-source
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts
            .github/release-contract.json
          sparse-checkout-cone-mode: false
      - name: Download the exact published candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: dist/release-candidate
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify the exact source tag
        id: release
        shell: bash
        run: bash reviewed-source/.github/scripts/release/finalize-release.sh verify
      - name: Create the GitHub release if absent
        id: create
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VSIX_FILE: ${{ steps.release.outputs.vsix-file }}
        run: bash reviewed-source/.github/scripts/release/finalize-release.sh create
      - name: Verify an existing GitHub release safely
        if: ${{ steps.create.outputs.already-released == 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VSIX_FILE: ${{ steps.release.outputs.vsix-file }}
        run: bash reviewed-source/.github/scripts/release/finalize-release.sh reconcile
