name: Release

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Immutable release candidate artifact ID
        required: true
        type: string
      candidate_run_id:
        description: Release candidate workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: release

jobs:
  publish:
    name: Publish the verified candidate
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      actions: read
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.id }}
      has-candidate: ${{ steps.artifact.outputs.has-candidate }}
    steps:
      - name: Verify the candidate workflow run
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r '.id | tostring' <<<"$run_json")" = "$CANDIDATE_RUN_ID"
          test "$(jq -r '.name' <<<"$run_json")" = 'Release candidate'
          test "$(jq -r '.event' <<<"$run_json")" = workflow_run
          test "$(jq -r '.head_branch' <<<"$run_json")" = master
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
      - name: Resolve the exact candidate artifact
        id: artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          artifacts="$(gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID/artifacts")"
          candidates="$(jq --argjson id "$ARTIFACT_ID" '[.artifacts[] | select(.id == $id and (.name | startswith("release-candidate-")) and (.expired == false))]' <<<"$artifacts")"
          count="$(jq 'length' <<<"$candidates")"
          test "$count" = 1
          echo 'has-candidate=true' >> "$GITHUB_OUTPUT"
          echo "id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          github-token: ${{ github.token }}
          path: dist/release-candidate
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify the candidate manifest, tag and digest
        id: manifest
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate=dist/release-candidate/candidate.json
          test "$(jq -r 'keys | sort | join(",")' "$candidate")" = 'candidateRunId,ciRunId,digest,notes,schemaVersion,sourceSha,version,vsixFile'
          test "$(jq -r '.schemaVersion' "$candidate")" = 1
          test "$(jq -r '.candidateRunId' "$candidate")" = "$CANDIDATE_RUN_ID"
          source_sha="$(jq -r '.sourceSha' "$candidate")"
          ci_run_id="$(jq -r '.ciRunId' "$candidate")"
          version="$(jq -r '.version' "$candidate")"
          vsix_file="$(jq -r '.vsixFile' "$candidate")"
          digest="$(jq -r '.digest' "$candidate")"
          test "$GITHUB_REF" = "refs/tags/v$version"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$vsix_file" =~ ^[A-Za-z0-9._-]+\.vsix$ ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          tag_json="$(gh api "repos/${{ github.repository }}/git/ref/tags/v$version")"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$source_sha"
          ci_run="$(gh api "repos/${{ github.repository }}/actions/runs/$ci_run_id")"
          test "$(jq -r '.name' <<<"$ci_run")" = Verify
          test "$(jq -r '.event' <<<"$ci_run")" = push
          test "$(jq -r '.head_branch' <<<"$ci_run")" = master
          test "$(jq -r '.head_sha' <<<"$ci_run")" = "$source_sha"
          test "$(jq -r '.conclusion' <<<"$ci_run")" = success
          test "$(sha256sum "dist/release-candidate/$vsix_file" | cut -d ' ' -f 1)" = "$digest"
          sha256sum --check --strict "dist/release-candidate/$vsix_file.sha256"
          echo "vsix-path=dist/release-candidate/$vsix_file" >> "$GITHUB_OUTPUT"
      - name: Publish to the Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        with:
          extensionFile: ${{ steps.manifest.outputs.vsix-path }}
          pat: ${{ env.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        with:
          extensionFile: ${{ steps.manifest.outputs.vsix-path }}
          pat: ${{ env.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          skipDuplicate: true
  finalize:
    name: Finalize the GitHub release
    needs: publish
    if: ${{ needs.publish.outputs.has-candidate == 'true' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the exact published candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: dist/release-candidate
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify the exact source tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          candidate=dist/release-candidate/candidate.json
          version="$(jq -r '.version' "$candidate")"
          source_sha="$(jq -r '.sourceSha' "$candidate")"
          vsix_file="$(jq -r '.vsixFile' "$candidate")"
          test "$GITHUB_REF" = "refs/tags/v$version"
          tag_json="$(gh api "repos/${{ github.repository }}/git/ref/tags/v$version")"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$source_sha"
          sha256sum --check --strict "dist/release-candidate/$vsix_file.sha256"
          jq -r '.notes' "$candidate" > dist/release-candidate/notes.md
          {
            echo "tag=v$version"
            echo "vsix-file=$vsix_file"
          } >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release if absent
        id: create
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VSIX_FILE: ${{ steps.release.outputs.vsix-file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'already-released=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" \
            "dist/release-candidate/$VSIX_FILE" \
            "dist/release-candidate/$VSIX_FILE.manifest.txt" \
            "dist/release-candidate/$VSIX_FILE.sha256" \
            dist/release-candidate/candidate.json \
            --notes-file dist/release-candidate/notes.md \
            --title "$TAG" \
            --verify-tag
          echo 'already-released=false' >> "$GITHUB_OUTPUT"
      - name: Verify an existing GitHub release safely
        if: ${{ steps.create.outputs.already-released == 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VSIX_FILE: ${{ steps.release.outputs.vsix-file }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release")" = "$TAG"
          mkdir -p dist/existing-release
          expected_names="$(printf '%s\n' candidate.json "$VSIX_FILE" "$VSIX_FILE.manifest.txt" "$VSIX_FILE.sha256" | sort)"
          unexpected_names="$(jq -r '.assets[].name' <<<"$release" | sort | comm -23 - <(printf '%s\n' "$expected_names"))"
          test -z "$unexpected_names"
          while IFS= read -r name; do
            if jq -e --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release" >/dev/null; then
              gh release download "$TAG" --dir dist/existing-release --pattern "$name"
              cmp "dist/release-candidate/$name" "dist/existing-release/$name"
            else
              gh release upload "$TAG" "dist/release-candidate/$name"
            fi
          done <<<"$expected_names"
          release="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")"
          asset_names="$(jq -r '.assets[].name' <<<"$release" | sort)"
          test "$asset_names" = "$expected_names"
